name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@2517a38a78046eaa6f51afc2dc12a33fc4beb4d7
    with:
      install: pip install -e ".[dev]"
  package:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: dist, path: dist/}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a reviewed release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - run: pip install build && python -m build
      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"

  pgvector:
    # Agent long-term memory round-trip against a real pgvector database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: mlaiops, POSTGRES_PASSWORD: mlaiops-ci, POSTGRES_DB: mlaiops}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlaiops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_MEMORY_DSN: postgresql://mlaiops:mlaiops-ci@localhost:5432/mlaiops
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_agents.py -k pgvector
