name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@76e4fed230c4f0b89b1bcf884df60e5b2fffca67
    with:
      install: pip install -e ".[dev]"
  package:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: pip install build==1.6.1 twine==7.0.0 && python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: dist, path: dist/, if-no-files-found: error}

  pgvector:
    # Agent long-term memory round-trip against a real pgvector database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: mlaiops, POSTGRES_PASSWORD: mlaiops-ci, POSTGRES_DB: mlaiops}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlaiops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_MEMORY_DSN: postgresql://mlaiops:mlaiops-ci@localhost:5432/mlaiops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_agents.py -k pgvector
