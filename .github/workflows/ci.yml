name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@main
    with:
      install: pip install -e ".[dev]"
  package:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
    permissions: {contents: write}

  pgvector:
    # Agent long-term memory round-trip against a real pgvector database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: mlaiops, POSTGRES_PASSWORD: mlaiops-ci, POSTGRES_DB: mlaiops}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlaiops"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_MEMORY_DSN: postgresql://mlaiops:mlaiops-ci@localhost:5432/mlaiops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_agents.py -k pgvector
