name: Publish Python SDK
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-sdk-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    if: '!github.event.release.prerelease'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: kiongahq/.github/release/validate@717e2cc3be707aff75c717662c6b3fea58ab56d8
        with:
          tag: ${{ github.event.release.tag_name }}
          default-branch: ${{ github.event.repository.default_branch }}
  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
  pypi:
    # Opt in only after the tracked account and publisher setup is complete.
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mlaiops-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - name: Publish verified distributions with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
  release-assets:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - name: Attach the same distributions and checksums to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY"
