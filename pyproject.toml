[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlaiops-sdk"
version = "0.2.0"
description = "Python client for the Kionga control plane"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
agno = ["agno>=2,<3"]
nooa = ["nooa>=0.0.7,<0.1"]
huggingface = ["huggingface-hub>=0.34,<2"]
agents = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langfuse>=2.0",
    "psycopg[binary]>=3.1",
]
runtime = [
    "mlaiops-sdk[agents]",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "mlaiops-sdk[agents,huggingface]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://kiongahq.github.io/docs/"
Source = "https://github.com/kiongahq/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["mlaiops_sdk"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Explicit, so a newer ruff with wider defaults cannot change the gate.
select = ["E4", "E7", "E9", "F"]
